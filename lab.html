<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="js/engine.js?v=2026.11.01-9"></script>
<script src="js/desk.js?v=2026.11.01-9"></script>
<script src="js/lab.js?v=2026.11.01-9"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080f">
<title>MarketMiner · Signal Lab</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg0:#06080f;--bg1:#0d1117;--bg2:#131a27;--bg3:#182030;--bdr:#1b2536;--bdr2:#263450;--t1:#e2e8f0;--t2:#8b9ab5;--t3:#5b6b85;--g:#00e676;--gb:rgba(0,230,118,.08);--r:#ff5252;--rb:rgba(255,82,82,.08);--a:#ffab00;--ab:rgba(255,171,0,.08);--b:#448aff;--cy:#18ffff;--gd:#FFD700;--o:#ff9100;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:13px}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg0);color:var(--t1);min-height:100vh;overflow-x:hidden}
a{color:inherit}.mono{font-family:var(--mono)}
.header{position:sticky;top:0;z-index:50;background:rgba(6,8,15,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--bdr);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--mono);font-weight:800;font-size:1.45rem;letter-spacing:-.5px}.logo .m{color:var(--cy)}.logo .s{color:var(--gd)}
.logo small{font:600 .7rem var(--mono);color:var(--t3);margin-left:8px;letter-spacing:.5px}
.hr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{background:var(--bg2);border:1px solid var(--bdr2);color:var(--t2);padding:6px 11px;border-radius:6px;cursor:pointer;font:600 .74rem var(--mono);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--cy);color:var(--cy)}
.btn.pri{background:rgba(24,255,255,.08);border-color:rgba(24,255,255,.35);color:var(--cy)}
.btn.gold{background:rgba(255,215,0,.1);border-color:rgba(255,215,0,.45);color:var(--gd)}
.btn.sm{padding:3px 8px;font-size:.68rem}.btn:disabled{opacity:.4;cursor:not-allowed}
.paper{font:700 .62rem var(--mono);color:var(--a);border:1px solid rgba(255,171,0,.4);background:var(--ab);padding:3px 7px;border-radius:4px;letter-spacing:.5px}
.wrap{max-width:1500px;margin:0 auto;padding:12px 16px 80px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ctl input,.ctl select,.set input,.set select{background:var(--bg1);border:1px solid var(--bdr2);color:var(--t1);padding:6px 9px;border-radius:6px;font:600 .8rem var(--mono)}
.ctl input{width:230px}
.seg{display:inline-flex;border:1px solid var(--bdr2);border-radius:6px;overflow:hidden}
.seg button{background:var(--bg1);border:0;border-right:1px solid var(--bdr2);color:var(--t2);padding:6px 9px;font:600 .72rem var(--mono);cursor:pointer}
.seg button:last-child{border-right:0}.seg button.on{background:rgba(255,215,0,.12);color:var(--gd)}
.qual{display:flex;gap:14px;flex-wrap:wrap;font:500 .7rem var(--mono);color:var(--t3);padding:6px 10px;border:1px solid var(--bdr);border-radius:7px;background:var(--bg1);margin-bottom:10px}
.qual b{color:var(--t2);font-weight:600}
.una{padding:22px;border:1px solid rgba(255,82,82,.4);background:var(--rb);border-radius:9px;text-align:center;font:800 1.1rem var(--mono);color:var(--r);margin-bottom:10px}
.una small{display:block;font:500 .75rem var(--mono);color:var(--t2);margin-top:6px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:10px;align-items:start}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
.cd{background:var(--bg1);border:1px solid var(--bdr);border-radius:9px;padding:12px;min-width:0}
.cd h3{font:700 .7rem var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#chartBox{position:relative;border-radius:8px;overflow:hidden;border:1px solid #d7dee8;background:#fff}
#chartBox[data-theme=dark]{border-color:var(--bdr);background:#0d1117}
#chart{height:470px}#rsiP{height:110px;border-top:1px solid #e5e9f0}#chartBox[data-theme=dark] #rsiP{border-top-color:var(--bdr)}
#sigWm{position:absolute;top:10px;left:12px;z-index:3;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;max-width:min(560px,calc(100% - 90px));padding:8px 11px;border-radius:8px;
  background:rgba(255,255,255,.62);border:1px solid rgba(15,23,42,.08);backdrop-filter:blur(2px);font:500 .7rem var(--mono);color:#334155;line-height:1.5}
#chartBox[data-theme=dark] #sigWm{background:rgba(13,17,23,.6);border-color:rgba(226,232,240,.08);color:#cbd5e1}
#sigWm .wm-sym{font:800 .95rem var(--mono);opacity:.75;letter-spacing:.3px}
#sigWm .wm-sig{font:800 .8rem var(--mono);margin-top:3px}
#sigWm .wm-row{opacity:.85}
#sigWm .wm-mini{font:800 .78rem var(--mono);white-space:nowrap}
#sigWm .wm-car{opacity:.6;margin-left:4px}
#sigWm.mini{padding:5px 10px}
#sigWm .wm-up{color:#15803d}#sigWm .wm-dn{color:#b91c1c}
#chartBox[data-theme=dark] #sigWm .wm-up{color:var(--g)}#chartBox[data-theme=dark] #sigWm .wm-dn{color:var(--r)}
#legend{position:absolute;top:10px;right:72px;z-index:3;pointer-events:none;display:flex;gap:9px;font:600 .62rem var(--mono);color:#64748b;background:rgba(255,255,255,.55);padding:3px 7px;border-radius:5px}
#chartBox[data-theme=dark] #legend{background:rgba(13,17,23,.55);color:#8b9ab5}
.live{font:700 .66rem var(--mono);padding:2px 7px;border-radius:4px;border:1px solid rgba(0,230,118,.4);color:var(--g);margin-right:6px;white-space:nowrap}
.live.off{color:var(--t3);border-color:var(--bdr2)}.live.err{color:var(--a);border-color:rgba(255,171,0,.4)}
.live b{color:var(--t1)}
#legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
@media(max-width:700px){#legend{display:none}#sigWm{font-size:.62rem;max-width:calc(100% - 70px)}}
.layers{display:flex;gap:10px;flex-wrap:wrap;font:500 .68rem var(--mono);color:var(--t2);margin-top:6px}
.layers label{display:flex;gap:4px;align-items:center;cursor:pointer}
.scorebar{display:flex;height:22px;border-radius:5px;overflow:hidden;font:700 .66rem var(--mono)}
.scorebar div{display:flex;align-items:center;justify-content:center;color:#06080f;min-width:0;overflow:hidden}
.sb-b{background:var(--g)}.sb-n{background:#3a4660;color:var(--t1)!important}.sb-r{background:var(--r)}
.fx{display:grid;grid-template-columns:1fr auto auto;gap:3px 8px;font:500 .7rem var(--mono);margin-top:8px}
.fx .na{color:var(--t3)}
.up{color:var(--g)}.dn{color:var(--r)}.nt{color:var(--t3)}.am{color:var(--a)}.cy{color:var(--cy)}.gd{color:var(--gd)}
.setup{border:1px solid var(--bdr2);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--bg2)}
.setup.L{border-left:3px solid var(--g)}.setup.S{border-left:3px solid var(--r)}
.setup.watch{opacity:.8}
.st-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.st-h b{font:700 .82rem var(--mono)}
.badge{font:800 .7rem var(--mono);padding:3px 7px;border-radius:4px;border:1px solid}
.gA{color:var(--g);border-color:rgba(0,230,118,.5);background:var(--gb)}.gB{color:var(--cy);border-color:rgba(24,255,255,.4)}
.gC{color:var(--a);border-color:rgba(255,171,0,.4)}.gN{color:var(--t3);border-color:var(--bdr2)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font:500 .72rem var(--mono);margin:6px 0}
.lv span{color:var(--t3);font-size:.62rem;text-transform:uppercase;display:block}
.why{font-size:.74rem;color:var(--t2);margin-top:5px;line-height:1.45}
.why li{margin-left:15px}.why .ag li{color:#d9a0a0}
.chip{display:inline-block;font:600 .62rem var(--mono);padding:2px 6px;border-radius:4px;border:1px solid var(--bdr2);color:var(--t2);margin:2px 3px 2px 0}
.chip.ok{color:var(--g);border-color:rgba(0,230,118,.4)}.chip.no{color:var(--a);border-color:rgba(255,171,0,.35)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0 8px;border-bottom:1px solid var(--bdr)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--t3);padding:8px 11px;font:700 .72rem var(--mono);text-transform:uppercase;letter-spacing:.4px;cursor:pointer}
.tabs button.on{color:var(--gd);border-bottom-color:var(--gd)}
.pane{display:none}.pane.on{display:block}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
table{width:100%;border-collapse:collapse;font:500 .72rem var(--mono)}
th{color:var(--t3);font-weight:600;text-align:left;padding:5px 6px;border-bottom:1px solid var(--bdr);font-size:.64rem;text-transform:uppercase;white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--bdr);white-space:nowrap}
td.r,th.r{text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font:500 .72rem var(--mono)}
.kv div:nth-child(odd){color:var(--t3)}
.note{font-size:.7rem;color:var(--t3);margin-top:8px;line-height:1.45}
.set{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.set label{display:flex;flex-direction:column;gap:3px;font:600 .64rem var(--mono);color:var(--t3);text-transform:uppercase}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bdr2);border-top-color:var(--cy);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;right:18px;background:var(--bg2);border:1px solid var(--bdr2);padding:10px 14px;border-radius:8px;font:600 .76rem var(--mono);z-index:99;max-width:420px;display:none}
.scroll{max-height:440px;overflow:auto}
.alert-new{color:var(--gd)}
.mtfc{text-align:center;font-weight:800}
.cd{overflow-x:auto}
@media(max-width:700px){.header{position:static}.wrap{padding:10px 10px 60px}.cols{grid-template-columns:1fr}.ctl input{width:100%}.seg{flex-wrap:wrap}#chart{height:340px}.lv{grid-template-columns:repeat(2,1fr)}.header{padding:8px 10px}}
</style>
</head>
<body>
<header class="header">
  <div class="hr"><div class="logo"><span class="m">MARKET</span><span class="s">MINER</span><small>SIGNAL LAB</small></div><span class="paper">PAPER TRADING ONLY</span><span class="paper" style="color:var(--cy);border-color:rgba(24,255,255,.4);background:rgba(24,255,255,.06)">📱 ON THIS DEVICE</span></div>
  <div class="hr">
    <a class="btn" href="index.html">← Dashboard</a>
    <a class="btn" href="desk.html">Day Desk</a>
    <a class="btn" href="crypto.html">₿ Crypto</a>
    <a class="btn" href="tv.html">📈 TradingView</a>
    <a class="btn gold" href="#bot" onclick="goBot();return false">🤖 Auto bot</a>
    <a class="btn" href="fyers.html">Connections</a>
    <button class="btn" id="alBtn" onclick="tab('alerts')">🔔 Alerts <span id="alN"></span></button>
  </div>
</header>
<main class="wrap">
  <div class="ctl">
    <select id="grp" onchange="fillWatch()"></select>
    <input id="sym" list="symList" placeholder="NSE:NIFTY50-INDEX, SHARK:BTCUSDT, YF:^GSPC" autocomplete="off">
    <datalist id="symList"></datalist>
    <div class="seg" id="tfs"></div>
    <button class="btn pri" onclick="run()">▶ Analyse</button>
    <label class="mono" style="font-size:.7rem;color:var(--t3);display:flex;gap:5px;align-items:center" title="On: signals include the candle still forming and update every few seconds (they can change until the candle closes). Off: signals only from closed candles."><input type="checkbox" id="liveMode" style="width:auto" checked> live signals (don't wait for candle close)</label>
    <span id="busy"></span>
  </div>
  <div id="qual" class="qual">Pick a symbol and timeframe, then Analyse.</div>
  <div id="una"></div>
  <div class="grid" id="top">
    <div class="cd">
      <h3><span>Chart · <span id="chTitle">—</span></span><span><span id="liveTag" class="live off">LIVE —</span> <span id="regTag"></span> <button class="btn sm" id="thBtn" onclick="toggleTheme()">☾ Dark chart</button> <button class="btn sm" id="tvBtn" onclick="toggleTV()">TradingView</button></span></h3>
      <div id="tvWrap" style="display:none"><div id="tvBox" style="height:580px"></div><div class="note" id="tvNote"></div></div><div id="chartBox" data-theme="light"><div id="chart"></div><div id="sigWm"></div><div id="legend"></div><div id="rsiP"></div></div>
      <div class="layers" id="layers"></div>
    </div>
    <div>
      <div class="cd" style="margin-bottom:10px">
        <h3><span>Directional score</span><span id="biasTag"></span></h3>
        <div class="scorebar" id="sbar"></div>
        <div class="fx" id="fx"></div>
      </div>
      <div class="cd"><h3><span>Trade setups</span><span id="minS" class="nt"></span></h3><div id="setups" class="scroll" style="max-height:620px"></div></div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <section class="pane" id="p-intel"></section>
  <section class="pane" id="p-deriv"></section>
  <section class="pane" id="p-mtf"></section>
  <section class="pane" id="p-bt"></section>
  <section class="pane" id="p-paper"></section>
  <section class="pane" id="p-bot"></section>
  <section class="pane" id="p-journal"></section>
  <section class="pane" id="p-alerts"></section>
  <section class="pane" id="p-settings"></section>
</main>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<script>
const TABS=[["intel","Intelligence"],["deriv","Derivatives"],["mtf","Multi-timeframe"],["bt","Backtest"],["paper","Paper & risk"],["bot","Auto bot"],["journal","Journal"],["alerts","Alerts"],["settings","Settings"]];
const TFS=["1m","3m","5m","15m","30m","1h","4h","1d","1w"];
let META=null,CUR=null,TF="15m",chart,cs,rsiC,rsiS,lines={},plines=[],SEL=0,autoT=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=(x,d)=>x==null||isNaN(x)?"—":Number(x).toLocaleString("en-IN",{maximumFractionDigits:d??(Math.abs(x)>=1000?2:Math.abs(x)>=1?2:6)});
const pct=x=>x==null?"—":(x>0?"+":"")+Number(x).toFixed(2)+"%";
const dir=v=>v>0?'<span class="up">▲ bull</span>':v<0?'<span class="dn">▼ bear</span>':'<span class="nt">● flat</span>';
const ts=t=>t?new Date(t*1000).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
function toast(m,ms=3500){const t=$("toast");t.innerHTML=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",ms)}
async function api(p,o){const r=await fetch(p,o);const j=await r.json().catch(()=>({detail:r.statusText}));if(!r.ok){const d=j.detail;throw new Error(Array.isArray(d)?d.map(x=>x.msg).join("; "):(d||r.statusText))}return j}
const post=(p,b)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});

let BOTJUMP=0;
function goBot(){tab("bot");BOTJUMP=Date.now();const j=()=>$("tabs").scrollIntoView({behavior:"smooth",block:"start"});j();
  // the chart and setups load after this and push the tabs down: follow them for a few seconds
  if(window.ResizeObserver&&!goBot.ro){goBot.ro=new ResizeObserver(()=>{if(Date.now()-BOTJUMP<8000)j()});goBot.ro.observe(document.body)}}
function tab(k){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id==="p-"+k));
  try{localStorage.setItem("lab.tab",k)}catch(e){}
  if(k==="mtf")ldMTF();if(k==="bt")rBT();if(k==="paper")ldPaper();if(k==="journal")ldJournal();if(k==="alerts")ldAlerts();if(k==="settings")rSettings();if(k==="bot"&&window.MMBOT)MMBOT.render();if(k==="deriv"&&CUR)rDeriv(CUR.derivatives)}

async function init(){
  $("tabs").innerHTML=TABS.map(([k,l])=>`<button data-k="${k}" onclick="tab('${k}')">${l}</button>`).join("");
  $("tfs").innerHTML=TFS.map(t=>`<button data-t="${t}" onclick="setTF('${t}')">${t}</button>`).join("");
  META=await api("/api/lab/meta");
  const groups={...META.watch};if(META.user_watch.length)groups["My watch-list"]=META.user_watch;
  $("grp").innerHTML=Object.keys(groups).map(g=>`<option>${esc(g)}</option>`).join("");META._groups=groups;
  let s=null,t=null,tb="intel";try{s=localStorage.getItem("lab.sym");t=localStorage.getItem("lab.tf");tb=localStorage.getItem("lab.tab")||"intel"}catch(e){}
  fillWatch();$("sym").value=s||"NSE:NIFTY50-INDEX";setTF(t||"15m",true);tab(location.hash==="#bot"?"bot":tb);if(location.hash==="#bot")setTimeout(goBot,600);
  $("minS").textContent=`signal ≥ ${META.protection.min_score}`;
  $("sym").addEventListener("keydown",e=>{if(e.key==="Enter")run()});
  try{$("liveMode").checked=localStorage.getItem("lab.live")!=="0"}catch(e){}
  $("liveMode").addEventListener("change",()=>{try{localStorage.setItem("lab.live",$("liveMode").checked?"1":"0")}catch(e){}run()});
  ldAlertCount();setInterval(ldAlertCount,60000);
  run();
}
function fillWatch(){const l=META._groups[$("grp").value]||[];$("symList").innerHTML=l.map(s=>`<option value="${esc(s)}">`).join("");if(l.length&&document.activeElement!==$("sym")&&CUR)$("sym").value=l[0]}
function setTF(t,silent){TF=t;document.querySelectorAll("#tfs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));if(!silent)run()}

let RUNNING=false;
const liveOn=()=>{const e=$("liveMode");return !e||e.checked};
async function run(fresh){
  const sym=$("sym").value.trim();if(!sym)return;
  if(fresh===true&&RUNNING)return;
  if(!fresh)liveStop();
  RUNNING=true;
  try{localStorage.setItem("lab.sym",sym);localStorage.setItem("lab.tf",TF)}catch(e){}
  $("busy").innerHTML='<span class="spin"></span>';
  try{
    const d=await api(`/api/lab/analyze?symbol=${encodeURIComponent(sym)}&tf=${TF}${fresh===true?"&fresh=1":""}${liveOn()?"&live=1":""}`);
    const keepSel=fresh===true&&CUR&&CUR.symbol===d.symbol&&CUR.tf===d.tf;
    CUR=d;$("una").innerHTML="";$("top").style.display="";if(!keepSel)SEL=0;if(SEL>=d.setups.length)SEL=0;render(d,keepSel);
  }catch(e){
    CUR=null;$("top").style.display="none";
    $("una").innerHTML=`<div class="una">DATA UNAVAILABLE<small>${esc(e.message)}</small><small>Signals are suppressed until the data source returns validated candles.</small></div>`;
    $("qual").innerHTML=`<span>${esc(sym)} · ${TF}</span>`;
  }finally{$("busy").innerHTML="";RUNNING=false}
}

function render(d,keep){
  const q=d.quality;
  $("qual").innerHTML=`<span>Source <b>${esc(q.source)}</b></span><span>As of <b>${ts(q.as_of)}</b></span><span>Candles <b>${d.candles.length}</b></span>`+
    `<span>Gaps <b>${q.gaps??0}</b>${q.missing_candles?` (${q.missing_candles} missing)`:""}</span><span>Duplicates removed <b>${q.duplicates_removed??0}</b></span>`+
    (q.stale?`<span class="dn">STALE — signals scored down</span>`:`<span class="up">fresh</span>`)+`<span>Computed in ${d.elapsed_ms} ms</span>`;
  $("chTitle").textContent=`${d.symbol} · ${d.tf}`;
  $("regTag").innerHTML=`<span class="chip">${esc(d.regime.label)}</span><span class="chip">volatility ${esc(d.regime.volatility)}</span>`+(d.context.kill_zone?`<span class="chip ok">${esc(d.context.kill_zone)}</span>`:"");
  rScore(d.score);rSetups(d);rChart(d,keep);if(TVON&&!keep)drawTV();rIntel(d);rDeriv(d.derivatives);
}

function rScore(s){
  $("sbar").innerHTML=`<div class="sb-b" style="width:${s.bull}%">${s.bull>12?"BULL "+s.bull.toFixed(0):""}</div><div class="sb-n" style="width:${s.neutral}%">${s.neutral>12?"NEUTRAL "+s.neutral.toFixed(0):""}</div><div class="sb-r" style="width:${s.bear}%">${s.bear>12?"BEAR "+s.bear.toFixed(0):""}</div>`;
  $("biasTag").innerHTML=`<span class="${s.bias==="bullish"?"up":s.bias==="bearish"?"dn":"nt"}">${s.bias.toUpperCase()}</span>`;

function rsiCalc(c,n=14){const o=Array(c.length).fill(null);let g=0,l=0;for(let i=1;i<c.length;i++){const d=c[i]-c[i-1],G=Math.max(d,0),Ls=Math.max(-d,0);if(i<=n){g+=G;l+=Ls;if(i===n){g/=n;l/=n;o[i]=l===0?100:100-100/(1+g/l)}}else{g=(g*(n-1)+G)/n;l=(l*(n-1)+Ls)/n;o[i]=l===0?100:100-100/(1+g/l)}}return o}

  if(plan.tick)anchorTick(d,plan.name);          // Shark ticks need Shark's own candle underneath (refreshed every 10 s)
  const dog=setTimeout(()=>{if(!got&&LIVEF.ws===ws){ws.onclose=null;try{ws.close()}catch(e){}LIVEF.ws=null;clearTimeout(LIVEF.anchor);LIVEF.anchor=null;pollTick(`${plan.name} silent, polling instead`)}},15000);
  ws.onopen=()=>{if(plan.sub)ws.send(JSON.stringify(plan.sub))};
  ws.onmessage=ev=>{
    const raw=String(ev.data);let m=null;
    if(plan.socketio){                            // Engine.IO v4 / Socket.IO framing
      if(raw[0]==="0"&&raw[1]!=="4"){ws.send("40");return}
      if(raw.startsWith("40")){ws.send("42"+JSON.stringify(["subscribe",{params:[plan.pair.toLowerCase()+"@ticker"]}]));return}
      if(raw==="2"){ws.send("3");return}
      if(!raw.startsWith("42"))return;
      try{const a=JSON.parse(raw.slice(2));if(a[0]!=="24hrTicker")return;m=a[1]}catch(e){return}
    }else{try{m=JSON.parse(raw)}catch(e){return}}
    const x=plan.parse(m);if(!x)return;
    if(plan.tick){if(!isFinite(x.price)||x.price<=0)return;got=true;clearTimeout(dog);LIVEF.retry=0;onTick(x.price,x.t,plan.name);return}
    if(!isFinite(x.close)||!x.time)return;got=true;clearTimeout(dog);LIVEF.retry=0;onLive(x,plan.name,Date.now()/1000,true)};
  ws.onclose=()=>{clearTimeout(dog);if(LIVEF.ws!==ws)return;LIVEF.ws=null;if(LIVEF.key!==key)return;
    const w=Math.min(30,2**(++LIVEF.retry));liveBadge("err",`LIVE reconnecting in ${w}s`);
    LIVEF.timer=setTimeout(()=>{LIVEF.timer=null;if(CUR&&LIVEF.key===key){clearTimeout(LIVEF.anchor);LIVEF.anchor=null;liveConnect(CUR)}},w*1000)};
}
async function anchorTick(d,name){                // Shark's current candle (OHLC) from MarketMiner; ticks then move it
  const key=d.symbol+"|"+d.tf;clearTimeout(LIVEF.anchor);
  try{const L=await api(`/api/lab/live?symbol=${encodeURIComponent(d.symbol)}&tf=${d.tf}`);if(LIVEF.key!==key)return;
    const c=L.candle,b=LIVEF.bar;
    if(!b||c.time>b.time)LIVEF.bar={...c};else if(c.time===b.time)LIVEF.bar={...c,high:Math.max(c.high,b.high),low:Math.min(c.low,b.low),close:b.t>L.server_time?b.close:c.close,t:b.t};
    if(!LIVEF.ws)onLive({...LIVEF.bar,closed:!L.forming},name,L.server_time,false)}catch(e){}
  if(LIVEF.key===key)LIVEF.anchor=setTimeout(()=>anchorTick(d,name),10000);
}
function onTick(price,t,name){
  const d=CUR;if(!d)return;const step=STEP[d.tf];let b=LIVEF.bar;
  const start=step>=86400?null:Math.floor(t/step)*step;  // intraday crypto candles are UTC-aligned
  if(!b)return liveBadge("",`● LIVE <b>${f(price)}</b> · ${esc(name)}`);
  if(start&&start>b.time)b=LIVEF.bar={time:start,open:price,high:price,low:price,close:price,volume:0,t};
  else{b.close=price;b.high=Math.max(b.high,price);b.low=Math.min(b.low,price);b.t=t}
  onLive({...b},name,t,true);
}
async function pollTick(note){
  clearTimeout(LIVEF.timer);const d=CUR;if(!d)return;const key=d.symbol+"|"+d.tf;let wait=2000;
  if(document.visibilityState!=="hidden"){
    try{const L=await api(`/api/lab/live?symbol=${encodeURIComponent(d.symbol)}&tf=${d.tf}`);if(LIVEF.key!==key)return;
      wait=Math.max(1,L.poll_s||2)*1000;const india=/^FYERS/.test(L.source);
      const name=(india?"FYERS quotes":L.source.split(" (")[0])+` · ${wait/1000}s`;LIVEF.src=name;
      onLive({...L.candle,closed:!L.forming},name,L.server_time,false,note)}
    catch(e){liveBadge("err","LIVE paused: "+String(e.message).slice(0,70));wait=15000}}
  if(LIVEF.key===key)LIVEF.timer=setTimeout(()=>pollTick(),wait);
}
function liveBadge(cls,html,title){const t=$("liveTag");t.className="live "+cls;t.innerHTML=html;if(title)t.title=title}
function onLive(c,srcName,now,stream,note){
  const d=CUR;if(!d)return;const step=STEP[d.tf],t=TH(),last=d.candles[d.candles.length-1].time;
  const baseClosed=d.quality&&d.quality.forming?last-step:last;   // newest CLOSED candle the analysis has
  const tz=(d.market==="NSE"||d.market==="FNO"||d.market==="MCX")?19800:0;
  if(c.time>=last&&!(c.closed&&c.time<last)){const col=c.close>=c.open?t.up:t.dn;
    try{cs.update({time:c.time+tz,open:c.open,high:c.high,low:c.low,close:c.close,color:col,wickColor:col,borderColor:col})}catch(e){}}
  const left=Math.max(0,Math.round(c.time+step-now)),mm=Math.floor(left/60),ss=String(left%60).padStart(2,"0");
  liveBadge("",`${stream?"● LIVE":"◐ LIVE"} <b>${f(c.close)}</b> · ${esc(srcName)} · ${new Date(now*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"})}`+
    (c.time+step>now&&!c.closed?` · candle ${mm}:${ss} left`:" · market idle")+(note?` · ${esc(note)}`:""),
    `${stream?"Streaming":"Updating"} from ${srcName}.`+(liveOn()?" Live signals: setups are recalculated every few seconds on the forming candle and marked LIVE until it closes.":" Signals wait for the candle to close."));
  // a candle has closed since the last analysis -> re-analyse at once on fresh data
  const closedT=c.closed?c.time:c.time-step;
  if(closedT>baseClosed){const nowMs=Date.now();
    if(LIVEF.req!==closedT){LIVEF.req=closedT;LIVEF.tries=1;LIVEF.reqAt=nowMs;setTimeout(()=>run(true),stream?1200:0)}
    else if(nowMs-LIVEF.reqAt>8000&&LIVEF.tries<4){LIVEF.tries++;LIVEF.reqAt=nowMs;run(true)}}
}

      ${(ch.unusual_oi||[]).length?`<div class="note">Unusual OI change (≥3× median): ${ch.unusual_oi.map(u=>`${f(u.strike)} ${u.side} ${f(u.oi_chg,0)} (${u.times_median}×)`).join(" · ")}</div>`:""}

  }
  if(der.perp){const p=der.perp;h+=card(`Perpetual · ${esc(p.pair)}`,p.error?`<div class="una" style="font-size:.9rem">DATA UNAVAILABLE<small>${esc(p.error)}</small></div>`:`<div class="kv"><div>Mark · spot</div><div>${f(p.mark)} · ${f(p.spot)}</div><div>Basis</div><div>${pct(p.basis_pct)}</div>
    <div>Funding rate</div><div>${p.funding_rate_pct==null?"—":p.funding_rate_pct.toFixed(4)+"%"}</div><div>Open interest</div><div>${f(p.oi_contracts,0)} contracts${p.oi_usd?` · $${f(p.oi_usd,0)}`:""}</div><div>OI change 6h</div><div>${p.oi_change_usd_6h==null?"—":"$"+f(p.oi_change_usd_6h,0)}</div></div><div class="note">Source: ${esc(p.source)} (Shark does not publish funding/OI on its public API).</div>`);

function statRow(n,s){return`<tr><td><b>${esc(n)}</b></td><td class="r">${s.trades||0}</td><td class="r">${s.trades?f(s.win_rate,1)+"%":"—"}</td><td class="r ${s.expectancy_r>0?"up":s.expectancy_r<0?"dn":""}">${s.trades?f(s.expectancy_r,3):"—"}</td><td class="r">${s.trades?f(s.profit_factor,2):"—"}</td><td class="r">${s.trades?f(s.total_r,2):"—"}</td><td class="r">${s.trades?f(s.max_drawdown_r,2):"—"}</td><td class="r">${s.trades?f(s.avg_win_r,2)+" / "+f(s.avg_loss_r,2):"—"}</td><td class="r">${s.trades?f(s.sharpe_per_trade,3):"—"}</td><td class="r">${s.trades?s.max_losing_streak:"—"}</td><td class="r">${s.trades?f(s.pnl,0):"—"}</td><td class="r">${s.trades?f(s.costs,0):"—"}</td></tr>`}
const SH=`<tr><th></th><th class="r">Trades</th><th class="r">Win%</th><th class="r">Exp R</th><th class="r">PF</th><th class="r">Total R</th><th class="r">Max DD R</th><th class="r">Avg W/L R</th><th class="r">Sharpe/trade</th><th class="r">Max L streak</th><th class="r">P&L</th><th class="r">Costs</th></tr>`;
function rBTOut(r){
  const tbl=(o,lab)=>`<table>${SH}${Object.entries(o).map(([k,v])=>statRow(lab?lab(k):k,v)).join("")}</table>`;
  const mc=r.monte_carlo;
  let eq=0;const curve=r.trades.map(t=>(eq+=t.r,{time:t.exit_time,value:+eq.toFixed(3)}));
  $("btOut").innerHTML=`<div class="cd" style="margin-top:10px"><h3>${esc(r.symbol)} · ${r.tf} · ${ts(r.from)} → ${ts(r.to)} · ${r.candles} candles · params: stop buffer ${r.params.stop_buffer_atr}×ATR, min R:R ${r.params.min_rr}</h3>
    <table>${SH}${statRow("Overall",r.overall)}${statRow("Train (60%)",r.train)}${statRow("Validation (20%)",r.validation)}${statRow("Untouched test (20%)",r.test)}</table>
    <div id="eqc" style="height:200px;margin-top:10px"></div><div class="note">Equity curve in R (after costs). ${r.notes.map(esc).join(" ")}</div></div>
    <div class="cols" style="margin-top:10px">
    ${card("Validation status (per strategy)",`<table><tr><th>Strategy</th><th>Status</th><th class="r">Val n · exp</th><th class="r">Test n · exp</th></tr>${Object.entries(r.validation_status).map(([k,v])=>`<tr><td>${esc(META.strategies[k]?.name||k)}</td><td class="${v.status==="validated"?"up":"am"}">${v.status}</td><td class="r">${v.val_trades} · ${f(v.val_expectancy,3)}</td><td class="r">${v.test_trades} · ${f(v.test_expectancy,3)}</td></tr>`).join("")}</table><div class="note">Validated = validation and test expectancy both > 0 with ≥20 trades. Nothing is deployed automatically.</div>`)}
    ${card("Monte Carlo",mc.available?`<div class="kv"><div>Runs × trades</div><div>${mc.runs} × ${mc.trades_per_run}</div><div>Total R p5 · p50 · p95</div><div>${mc.total_r_p5} · ${mc.total_r_p50} · ${mc.total_r_p95}</div><div>Max DD R p5 · p50</div><div>${mc.max_dd_r_p5} · ${mc.max_dd_r_p50}</div><div>Runs ending below 0</div><div>${mc.prob_negative}%</div></div>`:`<div class="nt">${esc(mc.note)}</div>`)}
    ${card("Walk-forward (out-of-sample folds)",`<table><tr><th>Fold</th><th>Params</th><th class="r">Trades</th><th class="r">Exp R</th><th class="r">Win%</th></tr>${r.walk_forward.map(w=>`<tr><td>${w.fold}</td><td>${w.params.stop_buffer_atr} · ${w.params.min_rr}</td><td class="r">${w.trades}</td><td class="r">${w.trades?f(w.expectancy_r,3):"—"}</td><td class="r">${w.trades?f(w.win_rate,1):"—"}</td></tr>`).join("")}</table>`)}
    ${card("Sensitivity (expectancy R)",`<table><tr><th>Stop buffer</th><th>Min R:R</th><th class="r">Train n · exp</th><th class="r">Validation n · exp</th></tr>${r.sensitivity.map(s=>`<tr${s.stop_buffer_atr===r.params.stop_buffer_atr&&s.min_rr===r.params.min_rr?' class="gd"':""}><td>${s.stop_buffer_atr}</td><td>${s.min_rr}</td><td class="r">${s.train.trades} · ${f(s.train.expectancy_r,3)}</td><td class="r">${s.validation.trades} · ${f(s.validation.expectancy_r,3)}</td></tr>`).join("")}</table><div class="note">A robust edge shows similar numbers across neighbouring cells; one bright cell is likely luck.</div>`)}
    </div>
    <div class="cd" style="margin-top:10px"><h3>By strategy</h3>${tbl(r.by_strategy,k=>META.strategies[k]?.name||k)}</div>
    <div class="cols" style="margin-top:10px">${card("By regime",tbl(r.by_regime))}${card("By side",tbl(r.by_side))}${card("By score bucket (all ≥45)",tbl(r.by_score))}${card("By hour of signal",tbl(r.by_hour,k=>k+":00"))}</div>
    <div class="cd" style="margin-top:10px"><h3>Trades (latest ${r.trades.length})</h3><div class="scroll"><table><tr><th>Signal</th><th>Strategy</th><th>Side</th><th class="r">Score</th><th class="r">Entry</th><th class="r">Stop</th><th class="r">Exit</th><th>Exit reason</th><th>Targets hit</th><th class="r">Bars</th><th class="r">Costs</th><th class="r">R</th></tr>
    ${r.trades.slice().reverse().map(t=>`<tr><td>${ts(t.signal_time)}</td><td>${esc(META.strategies[t.strategy]?.name||t.strategy)}</td><td class="${t.side==="LONG"?"up":"dn"}">${t.side}</td><td class="r">${f(t.score,0)}</td><td class="r">${f(t.entry)}</td><td class="r">${f(t.stop)}</td><td class="r">${f(t.exit)}</td><td>${esc(t.exit_reason)}</td><td>${t.targets_hit.join(" ")||"—"}</td><td class="r">${t.bars_held}</td><td class="r">${f(t.costs,2)}</td><td class="r ${t.r>0?"up":"dn"}">${f(t.r,2)}</td></tr>`).join("")}</table></div></div>`;
  if(curve.length){const c=LightweightCharts.createChart($("eqc"),{height:200,layout:{background:{color:"#0d1117"},textColor:"#8b9ab5"},grid:{vertLines:{color:"#131a27"},horzLines:{color:"#131a27"}},timeScale:{timeVisible:true}});
    const uniq=[];curve.forEach(p=>{if(uniq.length&&uniq[uniq.length-1].time>=p.time)p.time=uniq[uniq.length-1].time+1;uniq.push(p)});
    c.addLineSeries({color:"#FFD700",lineWidth:2}).setData(uniq);c.timeScale().fitContent()}
}

async function rSettings(){
  META=Object.assign(META,await api("/api/lab/meta"));
  const p=META.protection,rc=META.recorder,cs_=META.costs;let rs={};try{rs=await api("/api/lab/recorder")}catch(e){}
  const num=(id,v,step="any")=>`<input id="${id}" type="number" step="${step}" value="${v}">`;
  $("p-settings").innerHTML=`<div class="cd"><h3>Capital protection (paper)</h3><div class="set">
    <label>Paper capital INR${num("s_capital_inr",p.capital_inr)}</label><label>Paper capital USD${num("s_capital_usd",p.capital_usd)}</label>
    <label>Risk per trade %${num("s_risk_pct",p.risk_pct)}</label><label>Daily loss limit %${num("s_daily_loss_pct",p.daily_loss_pct)}</label><label>Weekly loss limit %${num("s_weekly_loss_pct",p.weekly_loss_pct)}</label>
    <label>Max open trades${num("s_max_open",p.max_open,1)}</label><label>Max per correlated group${num("s_max_correlated",p.max_correlated,1)}</label>
    <label>Loss streak lockout${num("s_loss_streak_lockout",p.loss_streak_lockout,1)}</label><label>Cooldown after a loss (min)${num("s_cooldown_min",p.cooldown_min,1)}</label>
    <label>Minimum signal score${num("s_min_score",p.min_score,1)}</label></div></div>
    <div class="cd" style="margin-top:10px"><h3>Strategies</h3><table><tr><th>On</th><th>Strategy</th><th>Stop buffer × ATR</th><th>Min R:R</th><th>Min avg volume</th><th style="white-space:normal">Rule</th></tr>
    ${Object.entries(META.strategies).map(([k,v])=>`<tr><td><input type="checkbox" id="e_${k}" ${v.params.enabled?"checked":""}></td><td><b>${esc(v.name)}</b></td><td><input id="b_${k}" type="number" step="0.05" value="${v.params.stop_buffer_atr}" style="width:70px"></td><td><input id="r_${k}" type="number" step="0.1" value="${v.params.min_rr}" style="width:70px"></td><td><input id="v_${k}" type="number" value="${v.params.min_avg_volume}" style="width:90px"></td><td style="white-space:normal;color:var(--t2)">${esc(v.description)}</td></tr>`).join("")}</table></div>
    <div class="cd" style="margin-top:10px"><h3>Costs</h3><div class="set"><label>Brokerage per order (INR)${num("c_brokerage_inr",cs_.brokerage_inr)}</label><label>Crypto taker fee (bps)${num("c_crypto_fee_bps",cs_.crypto_fee_bps)}</label><label>US commission (bps)${num("c_us_comm_bps",cs_.us_comm_bps)}</label></div><div class="note">Statutory Indian charges (STT, exchange, SEBI, stamp, GST) are built in; slippage and spread per market are in backend/lab/costs.py.</div></div>
    <div class="cd" style="margin-top:10px"><h3>Recorder & watch-list</h3><div class="set">
    <label>Recorder on<select id="rc_en"><option value="1" ${rc.enabled?"selected":""}>on</option><option value="0" ${rc.enabled?"":"selected"}>off</option></select></label>
    <label>Every (minutes)${num("rc_int",rc.interval_min,1)}</label><label>Scan timeframe<select id="rc_tf">${TFS.map(t=>`<option ${t===rc.scan_tf?"selected":""}>${t}</option>`).join("")}</select></label>
    <label style="grid-column:1/-1">Recorded / scanned symbols (comma separated)<input id="rc_sym" value="${esc(rc.symbols.join(", "))}"></label>
    <label>Timeframes recorded<input id="rc_tfs" value="${esc(rc.tfs.join(", "))}"></label><label>Option chains<input id="rc_ch" value="${esc(rc.chains.join(", "))}"></label>
    <label style="grid-column:1/-1">My watch-list (comma separated)<input id="w_list" value="${esc((META.user_watch||[]).join(", "))}"></label></div>
    <div class="note">Recorder: last run ${ts(rs.last_run)} · runs ${rs.runs??0} · candles in DB ${rs.db_candles??0} · chain snapshots ${rs.db_snapshots??0}${rs.last_error?` · <span class="dn">${esc(rs.last_error)}</span>`:""}</div>
    <div class="hr" style="margin-top:10px"><button class="btn gold" onclick="saveSettings()">Save settings</button><button class="btn" onclick="recNow()">Run recorder now</button></div></div>`;
}
const csv=s=>s.split(",").map(x=>x.trim()).filter(Boolean);
async function saveSettings(){
  const g=id=>+$(id).value,prot={};["capital_inr","capital_usd","risk_pct","daily_loss_pct","weekly_loss_pct","max_open","max_correlated","loss_streak_lockout","cooldown_min","min_score"].forEach(k=>prot[k]=g("s_"+k));
  const strat={};Object.keys(META.strategies).forEach(k=>strat[k]={enabled:$("e_"+k).checked,stop_buffer_atr:g("b_"+k),min_rr:g("r_"+k),min_avg_volume:g("v_"+k)});
  try{META=Object.assign(META,await post("/api/lab/settings",{protection:prot,strategies:strat,costs:{brokerage_inr:g("c_brokerage_inr"),crypto_fee_bps:g("c_crypto_fee_bps"),us_comm_bps:g("c_us_comm_bps")},
    recorder:{enabled:$("rc_en").value==="1",interval_min:g("rc_int"),scan_tf:$("rc_tf").value,symbols:csv($("rc_sym").value),tfs:csv($("rc_tfs").value),chains:csv($("rc_ch").value)},watch:csv($("w_list").value)}));
    toast("Saved");$("minS").textContent=`signal ≥ ${META.protection.min_score}`;rSettings()}catch(e){toast(`<span class="dn">${esc(e.message)}</span>`)}
}
async function recNow(){toast("Recorder running… this can take a minute",60000);try{const r=await post("/api/lab/recorder/run");toast("Recorder done: "+esc(JSON.stringify(r.last_summary||{})),6000);rSettings()}catch(e){toast(`<span class="dn">${esc(e.message)}</span>`)}}

init().catch(e=>{$("qual").innerHTML=`<span class="dn">Signal Lab engine could not start: ${esc(e.message)}</span>`});
</script>
<script>window.addEventListener('mm-lab-status',e=>{const q=document.getElementById('qual');if(q&&e.detail)q.innerHTML='<span class="spin"></span> '+e.detail});</script>
<script src="js/bot.js?v=2026.11.01-11"></script>
</body>
</html>
